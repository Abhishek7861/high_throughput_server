services:

  postgres:
    image: postgres:17
    container_name: fastapi_postgres
    restart: unless-stopped

    cpuset: "7-8"  # PostgreSQL pinned to CPU cores 7-8

    # Don't wait for the WAL flush on every commit: much higher write throughput, but a
    # Postgres crash can lose the last ~600ms of acknowledged writes (no corruption).
    # Remove for durability-sensitive tests.
    command: ["postgres", "-c", "synchronous_commit=off"]

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data2

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    cpuset: "9"  # Redis is single-threaded; pinned to CPU core 9
    ports:
      - "6379:6379"
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --dir
      - /data
      - --aof-use-rdb-preamble
      - "yes"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

    volumes:
      - redis_data:/data

  app:
    build: .
    image: load_test:latest
    container_name: load_test_app
    # App on cores 4-6 by default; override to test scaling, e.g. APP_CPUSET=4-5 docker compose up -d app
    # Cores 0-3 are left free for the load generator.
    cpuset: "${APP_CPUSET:-4-6}"
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      # Inside the compose network, services are reached by service name, not localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      # Not service_healthy: the app is built to run without Redis
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data: