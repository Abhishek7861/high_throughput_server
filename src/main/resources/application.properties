spring.application.name=load_test

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/users
spring.datasource.username=postgres
spring.datasource.password=postgres

# Read replica for read-only transactions (see DataSourceConfig). Remove jdbc-url to read
# from the primary only. Short timeouts so a down or hung replica falls back quickly.
app.datasource.replica.jdbc-url=jdbc:postgresql://localhost:5433/users?connectTimeout=1&socketTimeout=5
app.datasource.replica.username=postgres
app.datasource.replica.password=postgres
app.datasource.replica.pool-name=replica
app.datasource.replica.maximum-pool-size=10
app.datasource.replica.connection-timeout=250
app.datasource.replica.read-only=true

# Update the schema before PayloadDatabaseInitializer resets and seeds payload data.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
# Don't hold a DB session open for the whole HTTP request
spring.jpa.open-in-view=false

# Redis Configuration
# Standalone Redis on localhost by default. docker-compose sets SPRING_DATA_REDIS_CLUSTER_NODES,
# which switches the app to the Redis Cluster (cluster nodes take precedence over host/port).
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms
spring.data.redis.cluster.max-redirects=3
# Re-read the cluster topology on MOVED/ASK redirects and reconnects, and every 10 s,
# so a replica promoted after a primary fails is picked up
spring.data.redis.lettuce.cluster.refresh.adaptive=true
spring.data.redis.lettuce.cluster.refresh.period=10s

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false


# Virtual threads for request handling (Java 21+)
spring.threads.virtual.enabled=true
