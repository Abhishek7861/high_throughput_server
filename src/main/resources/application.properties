spring.application.name=load_test

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/users
spring.datasource.username=postgres
spring.datasource.password=postgres

# Update the schema before PayloadDatabaseInitializer resets and seeds payload data.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
# Don't hold a DB session open for the whole HTTP request
spring.jpa.open-in-view=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false


# Virtual threads for request handling (Java 21+)
spring.threads.virtual.enabled=true
